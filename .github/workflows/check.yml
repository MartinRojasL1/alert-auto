name: HiWi check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = normal run, test-mail = send a test email"
        type: choice
        options: [check, test-mail]
        default: check

permissions:
  contents: write

concurrency:
  group: hiwi-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run checker
        env:
          HIWI_TO: ${{ secrets.HIWI_TO }}
          HIWI_FROM: ${{ secrets.HIWI_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.mode }}" = "test-mail" ]; then
            python hiwi_alert.py --test-mail
          else
            python hiwi_alert.py
          fi

      - name: Save seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen HiWi entries" && git push)
